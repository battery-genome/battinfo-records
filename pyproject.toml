[project]
name = "battinfo-records"
version = "0.1.0"
description = "Curated BattINFO records corpus and the ingestion/curation scripts that produce it."
readme = "README.md"
requires-python = ">=3.10"
# The curation and ingestion scripts under scripts/ are standard-library only.
# The optional datasheet-ingest validation step imports BattINFO lazily; install
# it into the environment when needed, e.g. `uv pip install ../BattINFO`.
dependencies = []

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.uv]
# This repo is a data corpus + scripts, not an installable package.
package = false

[tool.ruff]
target-version = "py310"
line-length = 120
